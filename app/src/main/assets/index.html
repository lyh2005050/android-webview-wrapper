<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>上海海岸台XSG NAVTEX接收面板</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
        body { background:#1a1a1a; color:#ff9500; min-height:100dvh; padding-bottom:80px; }
        .header { padding:20px; display:flex; justify-content:space-between; align-items:center; }
        .title { font-size:20px; font-weight:bold; }
        .freq { font-size:80px; font-weight:900; padding:20px; color:#ff9500; }
        .tabs { display:flex; margin:10px; border-radius:12px; overflow:hidden; background:#2a2a2a; }
        .tab { flex:1; padding:15px; text-align:center; color:#888; }
        .tab.active { background:#ff9500; color:#000; font-weight:bold; }
        .display { margin:10px; padding:20px; background:#222; border-radius:12px; min-height:200px; border:1px solid #ff950033; }
        .bottom-bar { position:fixed; bottom:0; left:0; right:0; display:flex; padding:10px; gap:10px; background:#1a1a1a; }
        .btn { flex:1; padding:15px; border-radius:12px; background:#2a2a2a; text-align:center; color:#888; }
        .btn.active { background:#ff9500; color:#000; font-weight:bold; }
        .status { padding:0 20px; color:#888; font-size:14px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="title">上海海岸台XSG</div>
            <div style="color:#888">NAVTEX实时接收面板</div>
        </div>
        <div id="clock">--:--:--</div>
    </div>
    <div class="freq" id="freq">518<span style="font-size:20px"> kHz</span></div>
    <div class="status" id="status">等待SDR连接...</div>
    <div class="tabs">
        <div class="tab active">英文NAVTEX</div>
        <div class="tab">中文NAVTEX</div>
        <div class="tab">XSG摩尔斯</div>
    </div>
    <div class="display" id="display">等待接收...</div>
    <div class="bottom-bar">
        <div class="btn active">518kHz</div>
        <div class="btn">486kHz</div>
        <div class="btn">4215kHz</div>
    </div>
    <script>
        setInterval(()=>{
            document.getElementById('clock').textContent = new Date().toLocaleTimeString();
            fetch('http://150.138.84.87:42768/api/data')
                .then(r=>r.json())
                .then(d=>{
                    document.getElementById('status').textContent = '● 已连接 上海SDR节点';
                    document.getElementById('status').style.color = '#0f0';
                    document.getElementById('freq').innerHTML = d.current_freq + '<span style="font-size:20px"> kHz</span>';
                    document.getElementById('display').textContent = d.xsg || '等待报文...';
                })
                .catch(()=>{
                    document.getElementById('status').textContent = '● 等待SDR连接';
                    document.getElementById('status').style.color = '#888';
                })
        }, 2000);
    </script>
</body>
</html>
