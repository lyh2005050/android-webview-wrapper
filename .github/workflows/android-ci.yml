name: Android CI
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build Signed Release APK
      run: |
        chmod +x ./gradlew
        echo "android { signingConfigs { debug { storeFile file("debug.keystore") } } }" >> app/build.gradle.kts
        ./gradlew assembleRelease -x lint -x lintRelease
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: navtex-panel-signed.apk
        path: app/build/outputs/apk/release/*.apk
